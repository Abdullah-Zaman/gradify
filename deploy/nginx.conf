# Sample nginx site for Gradify on ONE domain.
#   https://your-domain.com/       -> frontend (Next.js, 127.0.0.1:3000)
#   https://your-domain.com/api/*  -> backend  (NestJS,  127.0.0.1:4000), "/api" prefix stripped
#
# Install: copy to /etc/nginx/sites-available/gradify, replace your-domain.com,
# symlink into sites-enabled, then `sudo certbot --nginx -d your-domain.com`
# (certbot fills in the ssl_certificate lines and the HTTP->HTTPS redirect).

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Task submission uploads go through /api; raise the 1 MB default.
    client_max_body_size 25m;

    # Backend API + uploaded files (/api/uploads/...).
    # The trailing slash on proxy_pass strips "/api", so /api/auth/login -> /auth/login.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
